services:
  web:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      VITE_PORT: "3000"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    command: bash -lc "npm install --no-audit --no-fund && npm run dev"

volumes:
  node_modules:
